[include]
files = [
  "/usr/share/umbriel/effects/border/pulse/effect.toml",
  "./shaders/community/animation/workspace-noctalia-wave/effect.toml"
]

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General

[general]
autostart = ["noctalia"]
mod_key = "Super"
xwayland = false
xwayland_native_resolution = false

# ==============================================================================
# Outputs

[output.eDP-1]
mode = "1920x1080@60"
position = [0, 0]
scale = 1.0
vrr = "disabled"
hdr = "auto"
min_workspaces = 3
cyclic_workspaces = true

# ==============================================================================
# Appearance
[appearance.blur]
radius = 5

# ==============================================================================
# Effects

[animation]
enabled = true

[effects]
border = "pulse"

# ==============================================================================
# Input
[input.keyboard]
numlock_toggle = true
layout = "br"

[input.cursor]
theme = "catppuccin-mocha-dark-cursors"
size = 28

# ==============================================================================
[keybinds]

# Effects
# "Mod+Shift+E" = "effect-border-cycle:borders"
# "Mod+Ctrl+E" = "effect-border-toggle"
# "Mod+Alt+E" = "effect-border-reset"

# Applications and session
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Period" = "spawn:noctalia msg panel-toggle control-center"
"Mod+W" = { action = "window-close", repeat = false }
"Mod+Escape" = "spawn:noctalia msg session lock"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+0" = "spawn:umbriel msg cheatsheet-toggle"
"Mod+P" = "spawn:noctalia msg screenshot-fullscreen"
"Print" = "spawn:noctalia msg screenshot-region"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+S" = "spawn:noctalia msg panel-toggle session"

# Focus and movement
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
# "Mod+Ctrl+Comma" = "window-consume-from-left"
# "Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Q" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+L" = "column-focus-tab-next"
"Mod+Alt+H" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# Audio
"Shift+Alt+1" = { action = "spawn:pactl set-card-profile alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic \"HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)\""} 
"Shift+Alt+2" = { action = "spawn:pactl set-card-profile alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic \"HiFi (HDMI1, HDMI2, HDMI3, Headphones, Mic1, Mic2)\""}
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"Alt+K" = "spawn:noctalia msg volume-up"
"Alt+J" = "spawn:noctalia msg volume-down"

# Video
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"

# ==============================================================================
# Layout
[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Keep game menus inside their window; a focus or workspace keybind releases the pointer.
# [[window_rule]]
# match.app_id = "^steam_app_.*$"
# confine_pointer = true
# ==============================================================================
# Layer rules
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false

# ==============================================================================
# Overview
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

# Add the bundled effects/animation/workspace_wipe/effect.toml to your includes.
[animation.workspaces]
style = "reveal"          # Default: "slide"
effect = "workspace-noctalia-wave"
duration_ms = 1000
curve = "linear"
