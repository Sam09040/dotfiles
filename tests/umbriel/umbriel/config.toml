[include]
files = [
  "./appearance.toml",
  "./binds.toml",
  "./shaders/community/animation/workspace-noctalia-wave/effect.toml",
  "/usr/share/umbriel/effects/border/pulse/effect.toml"
]

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General

[general]
autostart = ["noctalia"]
mod_key = "Super"
show_cheatsheet = false
xwayland = true
xwayland_native_resolution = false

# ==============================================================================
# Outputs

[output.eDP-1]
mode = "1920x1080@60"
position = [0, 0]
scale = 1.0
vrr = "disabled"
hdr = "auto"
min_workspaces = 3
cyclic_workspaces = true

# ==============================================================================
# Input
[input.keyboard]
numlock_toggle = true
layout = "br"

[input.cursor]
theme = "catppuccin-mocha-dark-cursors"
size = 28

# ==============================================================================
# Layout
[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
